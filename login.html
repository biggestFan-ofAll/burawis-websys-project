<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 6kun</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <h1>6kun</h1>
            <p>Where the strange gets archived.</p>
        </div>
        <nav>
            <a class="nav-link" href="index.html">Back to 6kun</a>
        </nav>
    </header>

    <main class="site-main">
        <section id="login">
            <h2 class="section-title">Log In</h2>
            <form action="#" method="post">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <label class="inline-label">
                    <input type="checkbox" id="remember" name="remember">
                    Keep me logged in
                </label>

                <button type="submit">Enter 6kun</button>
            </form>

            <p><a href="#">Forgot your password?</a></p>
            <p>New here? <a href="register.html">Make an account</a></p>
        </section>
    </main>

    <footer>
        <nav>
            <a class="footer-link" href="#">Privacy Policy</a>
            <a class="footer-link" href="#">Terms of Service</a>
        </nav>
        <p>&copy; 2026 6kun. Nothing stays buried forever.</p>
    </footer>
</body>
</html>
