<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - 6kun</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <h1>6kun</h1>
            <p>Where the strange gets archived.</p>
        </div>
        <nav>
            <a class="nav-link" href="index.html">Back to 6kun</a>
        </nav>
    </header>

    <main class="site-main">
        <section id="register">
            <h2 class="section-title">Join 6kun</h2>
            <form action="#" method="post">
                <label for="username">Pick a Username</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>

                <button type="submit">Join 6kun</button>
            </form>

            <p>Already lurking? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <footer>
        <nav>
            <a class="footer-link" href="#">Privacy Policy</a>
            <a class="footer-link" href="#">Terms of Service</a>
        </nav>
        <p>&copy; 2026 6kun. Nothing stays buried forever.</p>
    </footer>
</body>
</html>
