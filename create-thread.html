<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Thread - 6kun</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <h1>6kun</h1>
            <p>Where the strange gets archived.</p>
        </div>
        <nav>
            <a class="nav-link" href="home.html">Home</a>
            <a class="nav-link" href="category.html">Boards</a>
        </nav>
        <div class="user-controls">
            <a class="nav-link" href="profile.html">Profile</a>
            <a class="nav-link" href="index.html">Logout</a>
        </div>
    </header>

    <main class="site-main">
        <section id="create-thread">
            <h2 class="section-title">Post Something Weird</h2>
            <form action="#" method="post">
                <label for="title">What's going on?</label>
                <input type="text" id="title" name="title" required>

                <label for="category">Where does it belong?</label>
                <select id="category" name="category" required>
                    <option value="">Pick a board</option>
                    <option value="paranormal">Paranormal</option>
                    <option value="urban-legends">Urban Legends</option>
                    <option value="unexplained">Unexplained</option>
                </select>

                <label for="body">Tell us what happened</label>
                <textarea id="body" name="body" rows="10" required></textarea>

                <button type="submit">Post It</button>
            </form>
        </section>
    </main>

    <footer>
        <nav>
            <a class="footer-link" href="#">Community Guidelines</a>
            <a class="footer-link" href="#">Contact</a>
            <a class="footer-link" href="#">Help</a>
        </nav>
        <p>&copy; 2026 6kun. Nothing stays buried forever.</p>
    </footer>
</body>
</html>
